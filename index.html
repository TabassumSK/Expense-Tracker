<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
     <link rel="stylesheet" href="style.css">
    </head>
<body>
        <h2 class="bg-primary text-white text-center  m-0 p-4">
            <i class="fa-solid fa-wallet"></i>Track Your Expense
        </h2>

    
    <div class="balance-container text-center bg-light p-2">
        <p class="m-0 pt-2 fw-bold">Total Balance</p>
        <h2 id="total-balance" class="fw-bolder text-success">$0</h2>
    </div>
    
    <div class="expends d-flex justify-content-around">
        <div class="div text-success">
            <p class="m-0">Income</p>
            <h4 id="total-income">$0.00</h4>
        </div>

        <div class="div text-danger">
            <p class="m-0">Expends</p>
            <h4 id="total-expenses">$0.00</h4>
        </div>
    </div>

   <form id="expense-form">
    <div class="expense-form bg-light d-flex flex-column mb-3">
        <div class="mb-4">
            <label for="description" class="form-label">Description</label>
            <input id="description" class="form-control mt-2"
                   type="text" placeholder="Enter Expense Description" required>
        </div>

        <div class="mb-4">
            <label for="amt" class="form-label">Amount</label>
            <input id="amt" class="form-control mt-2"
                   type="number" min="0.01" step="0.01"
                   placeholder="Enter Expense Amount" required>
        </div>

        <div class="mb-4">
            <label for="date" class="form-label">Date</label>
            <input id="date" class="form-control mt-2"
                   type="date" required>
        </div>

        <button type="submit" class="btn btn-primary w-25 mt-4">
            + Entry
        </button>
    </div>
</form>

<div id="expense-list" class="container my-4"></div>


   <script src="app.js"></script>
</body>
</html>
